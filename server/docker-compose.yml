services:
  db:
    image: postgres:17
    restart: always
    ports:
      - "127.0.0.1:55407:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: module06demo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d module06demo"]
      interval: 5s
      timeout: 5s
      retries: 12
